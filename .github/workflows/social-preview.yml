name: Generate social preview

on:
  push:
    branches: [main]
    paths-ignore:
      - social-preview.jpg

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create 1200x630 social crop from hero photo
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("hero.jpg")
          output = Path("social-preview.jpg")
          image = Image.open(source).convert("RGB")

          target_w, target_h = 1200, 630
          crop_h = round(image.width * target_h / target_w)
          crop_h = min(crop_h, image.height)

          # Keep the top of the original photo so the runner's head remains visible.
          cropped = image.crop((0, 0, image.width, crop_h))
          cropped.resize((target_w, target_h), Image.Resampling.LANCZOS).save(
              output, "JPEG", quality=92, optimize=True
          )
          PY
        env:
          PYTHONUNBUFFERED: "1"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Commit social preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.jpg
          git diff --cached --quiet || git commit -m "Generate optimized social preview"
          git push
