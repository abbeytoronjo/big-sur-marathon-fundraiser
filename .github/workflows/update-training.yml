name: Update Training Data

on:
  schedule:
    # 9:43 AM Central (adjusts for daylight saving), plus a backup run at 11:43 AM.
    # Avoiding the top of the hour: GitHub is busiest then and often delays or skips runs.
    - cron: "43 9 * * *"
      timezone: "America/Chicago"
    - cron: "43 11 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-training:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run training update
        run: python3 update_training.py

      - name: Commit updated training data and cumulative history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-data.json training-history.json
          git diff --cached --quiet || git commit -m "Update cumulative training data"

      - name: Push changes
        run: |
          git pull --rebase origin main
          git push

