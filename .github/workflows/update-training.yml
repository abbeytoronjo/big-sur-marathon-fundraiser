name: Update training data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-training:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch RUNALYZE training data
        run: |
          python3 update_training.py

      - name: Commit updated training data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-data.json
          git diff --cached --quiet || git commit -m "Update training data"
          git push
