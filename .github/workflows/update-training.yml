name: Update Training Data

on:
  schedule:
    # Run every day at 8:00 AM Central during daylight saving time
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-training:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run training update
        run: python3 update_training.py

      - name: Commit updated training data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-data.json
          git diff --cached --quiet || git commit -m "Update training data"

      - name: Push changes
        run: git push
